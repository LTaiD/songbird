# Supabase free tier pauses projects after 7 days of inactivity (spec Phase 8).
# A twice-weekly read keeps the portfolio demo warm.
# Secrets: SUPABASE_URL (https://<ref>.supabase.co), SUPABASE_ANON_KEY.
name: supabase-keepalive
on:
  schedule:
    - cron: "0 9 * * 1,4" # Mon + Thu 09:00 UTC
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/tabs?select=id&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" > /dev/null
          echo "supabase pinged"
