# Render Blueprint (spec §4): backend as a Docker web service.
# Frontend deploys to Cloudflare Pages separately; set FRONTEND_ORIGIN to its URL.
services:
  - type: web
    name: songbird-backend
    runtime: docker
    rootDir: backend
    plan: starter          # batch CV+audio wants more than free-tier RAM
    healthCheckPath: /health
    envVars:
      - key: FRONTEND_ORIGIN
        value: https://songbird.pages.dev   # <- replace with your Pages URL
      - key: KERAS_BACKEND
        value: torch
